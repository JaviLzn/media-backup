name: MediaBackup
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MediaBackup:
    type: application
    platform: iOS
    sources: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mediabackup.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Media Backup consulta tu fototeca para comprobar respaldos."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
